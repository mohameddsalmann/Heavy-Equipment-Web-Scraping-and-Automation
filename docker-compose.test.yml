services:
  postgres_test:
    image: postgres:16-alpine
    container_name: equipment_postgres_test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: equipment_monitor_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d equipment_monitor_test"]
      interval: 2s
      timeout: 3s
      retries: 10
